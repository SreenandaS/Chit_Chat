# ========================================================
# ChitChat Database Configuration (MySQL)
# ========================================================
# Update these parameters to match your local MySQL server.
#
# Default MySQL settings:
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/chitchat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.username=root
db.password=root

# Fallback Option:
# If db.useFallback=true (default: true), ChitChat will automatically
# connect to a local persistent database (./data/chitchat_db in MySQL mode)
# if MySQL is unreachable. This guarantees the application runs out-of-the-box!
db.useFallback=true
